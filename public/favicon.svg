<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favGold" x1="15%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="35%" stop-color="#E5B232" />
      <stop offset="70%" stop-color="#B37C0C" />
      <stop offset="100%" stop-color="#784E03" />
    </linearGradient>
    <linearGradient id="favFacet" x1="85%" y1="15%" x2="20%" y2="85%">
      <stop offset="0%" stop-color="#FFE899" />
      <stop offset="50%" stop-color="#C99418" />
      <stop offset="100%" stop-color="#5E3C00" />
    </linearGradient>
    <linearGradient id="favCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="#0C1014" />

  <!-- Cyan Laser Inner Rim Glow -->
  <path
    d="M 58 17 C 28 17 18 42 28 72 C 34 52 46 36 62 25 Z"
    fill="none"
    stroke="url(#favCyan)"
    stroke-width="2.5"
    opacity="0.9"
  />

  <!-- Crescent Crucible Base (Outer Curve) -->
  <path
    d="M 61 14 C 24 16 12 45 23 76 C 29 82 34 85 41 85 C 57 85 70 75 79 60 C 65 72 48 76 35 68 C 24 58 24 38 43 24 C 48 20 54 16 61 14 Z"
    fill="url(#favGold)"
  />

  <!-- Crescent Inner Facet / Bevel -->
  <path
    d="M 59 18 C 28 22 20 45 28 70 C 37 54 50 36 65 26 C 63 23 61 20 59 18 Z"
    fill="url(#favFacet)"
    opacity="0.5"
  />

  <!-- Arrow Shaft & Monogram "F" Wings -->
  <path
    d="M 28 71 L 68 28 L 73 33 L 33 76 Z"
    fill="url(#favGold)"
  />

  <!-- Arrowhead -->
  <path
    d="M 76 17 L 78 37 L 70 34 L 66 38 L 65 30 L 61 27 L 76 17 Z"
    fill="url(#favGold)"
  />

  <!-- "F" Top Rung -->
  <path
    d="M 54 42 L 67 43 L 69 49 L 58 48 Z"
    fill="url(#favFacet)"
  />

  <!-- "F" Middle Rung -->
  <path
    d="M 43 53 L 53 54 L 54 59 L 46 58 Z"
    fill="url(#favGold)"
  />

  <!-- Bevel Highlight Line -->
  <path
    d="M 31 73 L 71 30"
    stroke="#FFF8D6"
    stroke-width="1.2"
    stroke-linecap="round"
    opacity="0.8"
  />
</svg>
