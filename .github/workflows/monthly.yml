name: monthly-edition

on:
  schedule:
    # Day 1 of every month, 05:00 UTC: automated pull (runbook day 1).
    - cron: '0 5 1 * *'
  workflow_dispatch:
    inputs:
      edition:
        description: 'Edition id (YYYY-MM). Must be newer than the latest frozen edition.'
        required: false
        default: ''
      as-of:
        description: 'Data cut date (YYYY-MM-DD). Defaults to today.'
        required: false
        default: ''
      published:
        description: 'Publish date (YYYY-MM-DD). Defaults to today.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  ingest-and-build:
    runs-on: ubuntu-latest
    env:
      BITQUERY_API_KEY: ${{ secrets.BITQUERY_API_KEY }}
      EXPLORER_API_URL: ${{ vars.EXPLORER_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify suite before the run
        run: npm test
      - name: Monthly pull and carried edition
        run: npm run monthly -- --edition="${{ inputs.edition }}" --as-of="${{ inputs.as-of }}" --published="${{ inputs.published }}"
      - name: Verify the built edition
        run: npm test && npx tsc --noEmit && npm run lint && npm run build
      - name: Commit snapshot and edition
        run: |
          git config user.name "fineness-ci"
          git config user.email "fineness-ci@users.noreply.github.com"
          git add data/snapshots data/editions
          git diff --cached --quiet || git commit -m "chore: monthly ingest snapshot and carried edition"
          git push
